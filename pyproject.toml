[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-dispatch"
version = "0.1.0"
description = "Geospatial courier search and simulation for TP1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=2.18,<5",
    "osmnx>=2.1,<3",
    "plotly>=5.24,<7",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["delivery_dispatch*"]
namespaces = false

[tool.setuptools.package-data]
delivery_dispatch = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests involving multiple components",
    "slow: long-running tests",
    "network: tests requiring external services or map downloads",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
