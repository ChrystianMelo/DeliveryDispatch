name: Build LaTeX PDF

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/build-latex.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/build-latex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report.tex
          working_directory: docs

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dispatch-report
          path: docs/report.pdf
          if-no-files-found: error
          retention-days: 30

  publish-report:
    needs: build-latex
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - name: Download PDF
        uses: actions/download-artifact@v4
        with:
          name: delivery-dispatch-report
          path: docs

      - name: Publish report release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_COMMIT: ${{ github.sha }}
        run: |
          if gh release view report > /dev/null 2>&1; then
            gh release upload report docs/report.pdf --clobber
          else
            gh release create report docs/report.pdf \
              --target "$REPORT_COMMIT" \
              --title "Relatório do TP1" \
              --notes "PDF atualizado automaticamente a partir de docs/report.tex." \
              --latest=false
          fi
