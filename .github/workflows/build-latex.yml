name: Build LaTeX PDF

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/report.tex"
      - "docs/figures/**"
  pull_request:
    paths:
      - "README.md"
      - "docs/report.tex"
      - "docs/figures/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report.tex
          working_directory: docs

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dispatch-report
          path: docs/report.pdf
          if-no-files-found: error
          retention-days: 30

  publish-report:
    needs: build-latex
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PDF
        uses: actions/download-artifact@v4
        with:
          name: delivery-dispatch-report
          path: docs

      - name: Publish report release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_COMMIT: ${{ github.sha }}
        run: |
          SHORT_SHA="${REPORT_COMMIT::7}"
          REPORT_TAG="report-${SHORT_SHA}"
          REPORT_TITLE="DeliveryDispatch Report (${SHORT_SHA})"

          if gh release view "$REPORT_TAG" > /dev/null 2>&1; then
            gh release upload "$REPORT_TAG" docs/report.pdf --clobber
            gh release edit "$REPORT_TAG" \
              --title "$REPORT_TITLE" \
              --notes-file README.md \
              --latest
          else
            gh release create "$REPORT_TAG" docs/report.pdf \
              --target "$REPORT_COMMIT" \
              --title "$REPORT_TITLE" \
              --notes-file README.md \
              --latest
          fi
