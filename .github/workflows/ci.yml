name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python scripts/tasks.py setup
      - name: Check lint and formatting
        run: python scripts/tasks.py check
      - name: Run tests
        run: python scripts/tasks.py test
      - name: Build distribution
        run: python scripts/tasks.py build
